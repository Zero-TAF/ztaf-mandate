[project]
name = "ztaf-mandate"
version = "0.1.0"
description = "Zero-TAF mandate-chain reference implementation: canonical hashing, Ed25519 signing, chain verification with strict attenuation, revocation status lists, golden vectors."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ztaf_mandate"]
